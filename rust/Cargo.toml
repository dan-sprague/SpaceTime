[package]
name = "spacetime"
version = "0.1.0"
edition = "2021"
description = "Real-time general-relativistic ray tracer (Rust + Metal port of SpaceTime.jl)"
license = "MIT"

[dependencies]
metal = "0.27"
winit = "0.29"
cocoa = "0.25"
objc = "0.2"
core-graphics-types = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
